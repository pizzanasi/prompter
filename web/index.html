<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Prompter</title>
  <meta name="description" content="Teleprompter: teks jalan otomatis, kontrol pake panah, ukuran &amp; opacity bisa diatur. Scrolling teleprompter with keyboard controls, in Bahasa Indonesia and English.">
  <meta property="og:title" content="Prompter">
  <meta property="og:description" content="Teleprompter: teks jalan otomatis, kontrol pake panah, ukuran &amp; opacity bisa diatur. Bahasa Indonesia / English.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#141418">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141418'/%3E%3Crect x='3' y='13' width='26' height='7' fill='%23ffc940' opacity='.3'/%3E%3Cpath d='M8 9h16M6 16.5h20M9 24h14' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <header id="bar">
      <svg class="drag-dots" viewBox="0 0 10 16" aria-hidden="true"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>
      <span class="title">Prompter</span>
      <span id="status" class="chip"></span>
      <div class="actions">
        <button id="btnPlay" class="icon" data-i18n-title="bar.play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
        </button>
        <button id="btnEdit" class="icon" data-i18n-title="bar.edit">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z M13.5 6.5l4 4"/></svg>
        </button>
        <button id="btnSettings" class="icon" data-i18n-title="bar.settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
        <button id="btnHelp" class="icon" data-i18n-title="bar.help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6M12 17h.01"/></svg>
        </button>
        <button id="btnSupport" class="icon" data-i18n-title="bar.support">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.7C19.5 15.4 12 20 12 20z"/></svg>
        </button>
        <button id="btnPip" class="icon" data-i18n-title="bar.pip">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="btnFullscreen" class="icon web-only" data-i18n-title="bar.fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <span class="sep electron-only"></span>
        <button id="btnMin" class="icon electron-only" data-i18n-title="bar.minimize">
          <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
        </button>
        <button id="btnClose" class="icon danger electron-only" data-i18n-title="bar.close">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <div id="scroller"><div id="content"></div></div>
    </main>
    <div id="guide" aria-hidden="true"></div>

    <div id="progress" aria-hidden="true"><div></div></div>
    <div id="hud" role="status" aria-live="polite"></div>
    <button id="supportNudge" class="nudge" data-i18n="support.nudge" hidden></button>

    <!-- Support / donations -->
    <section id="support" class="panel" hidden>
      <div class="panel-head">
        <h2 data-i18n="support.title"></h2>
        <button class="icon" data-close data-i18n-title="panel.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
      <div class="panel-body">
        <p class="support-body" data-i18n="support.body"></p>
        <div id="supportLinks" class="support-links"></div>
        <p class="muted support-note" data-i18n="support.note"></p>
      </div>
    </section>

    <!-- Script editor -->
    <section id="editor" class="panel" hidden>
      <div class="panel-head">
        <h2 data-i18n="editor.title"></h2>
        <span class="hint" data-i18n="editor.hint"></span>
      </div>
      <textarea id="editorText" spellcheck="false" data-i18n-placeholder="editor.placeholder"></textarea>
      <div class="panel-foot">
        <button id="btnOpenFile" class="btn" data-i18n="editor.openFile"></button>
        <span id="wordCount" class="muted"></span>
        <span class="grow"></span>
        <button class="btn" data-close data-i18n="editor.cancel"></button>
        <button id="btnSaveScript" class="btn primary" data-i18n="editor.save"></button>
      </div>
      <input id="fileInput" type="file" accept=".txt,.md,.text,text/plain" hidden>
    </section>

    <!-- Settings -->
    <aside id="settings" class="panel" hidden>
      <div class="panel-head">
        <h2 data-i18n="settings.title"></h2>
        <button class="icon" data-close data-i18n-title="panel.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
      <div class="panel-body">
        <label class="field inline lang-row"><span data-i18n="settings.language"></span>
          <select data-key="lang">
            <option value="id">Bahasa Indonesia</option>
            <option value="en">English</option>
          </select></label>

        <h3 data-i18n="settings.motion"></h3>
        <label class="field"><span data-i18n="settings.speed"></span><output data-for="speed"></output>
          <input type="range" data-key="speed" min="1" max="30" step="1"></label>

        <h3 data-i18n="settings.text"></h3>
        <label class="field"><span data-i18n="settings.fontSize"></span><output data-for="fontSize"></output>
          <input type="range" data-key="fontSize" min="18" max="160" step="1"></label>
        <label class="field"><span data-i18n="settings.lineHeight"></span><output data-for="lineHeight"></output>
          <input type="range" data-key="lineHeight" min="1" max="2.2" step="0.05"></label>
        <label class="field"><span data-i18n="settings.width"></span><output data-for="width"></output>
          <input type="range" data-key="width" min="40" max="100" step="1"></label>
        <label class="field inline"><span data-i18n="settings.font"></span>
          <select data-key="fontFamily">
            <option value="sans">Sans</option>
            <option value="serif">Serif</option>
            <option value="mono">Mono</option>
          </select></label>
        <label class="field inline"><span data-i18n="settings.weight"></span>
          <select data-key="fontWeight">
            <option value="400" data-i18n="settings.weight.400"></option>
            <option value="600" data-i18n="settings.weight.600"></option>
            <option value="800" data-i18n="settings.weight.800"></option>
          </select></label>
        <label class="field inline"><span data-i18n="settings.align"></span>
          <select data-key="align">
            <option value="left" data-i18n="settings.align.left"></option>
            <option value="center" data-i18n="settings.align.center"></option>
          </select></label>
        <label class="field inline"><span data-i18n="settings.textColor"></span>
          <input type="color" data-key="textColor"></label>
        <label class="field inline"><span data-i18n="settings.outline"></span>
          <input type="checkbox" class="switch" data-key="outline"></label>

        <h3 data-i18n="settings.background"></h3>
        <label class="field inline"><span data-i18n="settings.bgColor"></span>
          <input type="color" data-key="bgColor"></label>
        <label class="field"><span data-i18n="settings.bgOpacity"></span><output data-for="bgOpacity"></output>
          <input type="range" data-key="bgOpacity" min="0" max="100" step="1"></label>

        <h3 data-i18n="settings.display"></h3>
        <label class="field inline"><span data-i18n="settings.showGuide"></span>
          <input type="checkbox" class="switch" data-key="showGuide"></label>
        <label class="field"><span data-i18n="settings.guidePos"></span><output data-for="guidePos"></output>
          <input type="range" data-key="guidePos" min="10" max="80" step="1"></label>
        <label class="field inline"><span data-i18n="settings.fade"></span>
          <input type="checkbox" class="switch" data-key="fade"></label>
        <label class="field inline"><span data-i18n="settings.mirror"></span>
          <input type="checkbox" class="switch" data-key="mirror"></label>

        <div class="electron-only">
          <h3 data-i18n="settings.window"></h3>
          <label class="field inline"><span data-i18n="settings.alwaysOnTop"></span>
            <input type="checkbox" class="switch" data-key="alwaysOnTop"></label>
          <label class="field inline"><span data-i18n="settings.hideFromCapture"></span>
            <input type="checkbox" class="switch" data-key="hideFromCapture"></label>
        </div>

        <button id="btnReset" class="btn wide" data-i18n="settings.reset"></button>
      </div>
    </aside>

    <!-- Shortcuts -->
    <section id="help" class="panel" hidden>
      <div class="panel-head">
        <h2 data-i18n="help.title"></h2>
        <button class="icon" data-close data-i18n-title="panel.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
      <div class="panel-body keys">
        <kbd data-i18n="help.space"></kbd><span data-i18n="help.playPause"></span>
        <kbd>↓</kbd><span data-i18n="help.down"></span>
        <kbd>↑</kbd><span data-i18n="help.up"></span>
        <kbd>→</kbd><span data-i18n="help.right"></span>
        <kbd>←</kbd><span data-i18n="help.left"></span>
        <kbd>PgUp PgDn</kbd><span data-i18n="help.page"></span>
        <kbd>Home End</kbd><span data-i18n="help.homeEnd"></span>
        <kbd>+ −</kbd><span data-i18n="help.size"></span>
        <kbd>M</kbd><span data-i18n="help.mirror"></span>
        <kbd>E</kbd><span data-i18n="help.edit"></span>
        <kbd>S</kbd><span data-i18n="help.settings"></span>
        <kbd>L</kbd><span data-i18n="help.language"></span>
        <kbd class="pip-only">P</kbd><span class="pip-only" data-i18n="help.pip"></span>
        <kbd class="web-only">F</kbd><span class="web-only" data-i18n="help.fullscreen"></span>
        <kbd>Esc</kbd><span data-i18n="help.esc"></span>
        <kbd>Scroll</kbd><span data-i18n="help.wheel"></span>
        <kbd class="web-only" data-i18n="help.touchKey"></kbd><span class="web-only" data-i18n="help.touch"></span>
      </div>
      <p class="muted foot-note electron-only" data-i18n="help.note"></p>
      <p class="muted foot-note web-only" data-i18n="help.noteWeb"></p>
    </section>

    <div class="resize electron-only" data-edge="l"></div>
    <div class="resize electron-only" data-edge="r"></div>
    <div class="resize electron-only" data-edge="b"></div>
    <div class="resize electron-only" data-edge="lb"></div>
    <div class="resize electron-only" data-edge="rb"></div>
  </div>

  <!-- Shown in this tab while the prompter is in its floating window -->
  <section id="pipNotice" class="pip-notice">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
    <h1 data-i18n="pip.title"></h1>
    <p data-i18n="pip.body"></p>
    <button id="btnPipBack" class="btn primary" data-i18n="pip.back"></button>
  </section>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
